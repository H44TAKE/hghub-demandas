name: CI

# Roda a cada push/PR: testes + verificacao de segredos. Nao publica nada.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes
      - name: Nenhum segredo no repositorio
        run: python tools/verificar_segredos.py
      - name: Lint
        run: python -m pyflakes backend tools tests app.py
      - name: Testes
        run: python -m pytest tests -q
